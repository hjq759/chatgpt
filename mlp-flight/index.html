    }

        id = decodeURIComponent(href.slice(1));

      }

&lt;div id=&quot;neural-flight&quot;&gt;
 &lt;h2&gt;外卖议事厅 · 穿越多层感知机&lt;/h2&gt;
 &lt;div class=&quot;text-small text-muted&quot;&gt;饥饿程度 0.80、价格贵的程度 0.40 → 三位朋友各算支持分 → 群聊汇总。你负责把消息送给朋友②，再把他的意见带到终点。&lt;/div&gt;
 &lt;div class=&quot;viz-controls&quot;&gt;&lt;button class=&quot;btn btn-primary&quot; id=&quot;flight-start&quot;&gt;带着饥饿消息出发&lt;/button&gt;&lt;button class=&quot;btn&quot; id=&quot;flight-view&quot; aria-pressed=&quot;false&quot;&gt;看看朋友们的位置&lt;/button&gt;&lt;span id=&quot;flight-count&quot; class=&quot;tabular-nums&quot;&gt;已通过 0 / 7 站&lt;/span&gt;&lt;span id=&quot;flight-cargo&quot; class=&quot;text-small tabular-nums&quot;&gt;当前数值：0.800&lt;/span&gt;&lt;/div&gt;

 &lt;div class=&quot;flight-layout&quot;&gt;&lt;section class=&quot;flight-scene&quot; aria-label=&quot;三维飞行画面&quot;&gt;
 &lt;canvas class=&quot;cursor-interaction&quot; role=&quot;img&quot; aria-label=&quot;点外卖主题的三维神经网络飞行游戏。饥饿0.80与价格贵0.40作为输入，三位朋友对应三个中间神经元。你经过朋友②，得到支持分0.14，再向群聊发送加权意见0.098。最后汇总为1.218，转换为约77.2%的点外卖概率。&quot;&gt;&lt;/canvas&gt;
 &lt;div class=&quot;viz-controls&quot; aria-label=&quot;飞行方向&quot;&gt;&lt;button class=&quot;btn&quot; data-move=&quot;left&quot; aria-label=&quot;向左飞&quot;&gt;←&lt;/button&gt;&lt;button class=&quot;btn&quot; data-move=&quot;up&quot; aria-label=&quot;向上飞&quot;&gt;↑&lt;/button&gt;&lt;button class=&quot;btn&quot; data-move=&quot;down&quot; aria-label=&quot;向下飞&quot;&gt;↓&lt;/button&gt;&lt;button class=&quot;btn&quot; data-move=&quot;right&quot; aria-label=&quot;向右飞&quot;&gt;→&lt;/button&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;自动前进，你只管转向：拖动画面、按方向键或长按箭头&lt;/span&gt;&lt;/div&gt;
 &lt;div id=&quot;flight-status&quot; aria-live=&quot;polite&quot;&gt;待送达：大家挺饿，但又有点嫌贵。朋友②会怎样权衡？&lt;/div&gt;
 &lt;div class=&quot;text-small text-muted&quot;&gt;每条输入都连到三位朋友，这叫“全连接”。7 个光环拆解的是计算步骤，并不代表 7 层。&lt;/div&gt;
 &lt;/section&gt;&lt;aside class=&quot;flight-data&quot; aria-label=&quot;同步计算数据&quot;&gt;
 &lt;h3&gt;随行账本&lt;/h3&gt;
 &lt;div class=&quot;viz-row tabular-nums&quot;&gt;&lt;span&gt;饥饿：0.80&lt;/span&gt;&lt;span&gt;价格贵：0.40&lt;/span&gt;&lt;/div&gt;
 &lt;div class=&quot;card flight-live&quot;&gt;&lt;div id=&quot;flight-side-step&quot; class=&quot;text-small&quot; aria-live=&quot;polite&quot;&gt;准备出发 · 输入数据&lt;/div&gt;
 &lt;div id=&quot;flight-mlp-operation&quot; class=&quot;text-small&quot; aria-live=&quot;polite&quot;&gt;输入向量 x&lt;/div&gt;
 &lt;div id=&quot;flight-formula&quot; class=&quot;tabular-nums&quot; aria-live=&quot;polite&quot;&gt;饥饿程度：0.80；价格贵的程度：0.40&lt;/div&gt;
 &lt;div id=&quot;flight-value&quot; class=&quot;text-small&quot; aria-live=&quot;polite&quot;&gt;越饿越支持点外卖，越贵越反对。每位朋友在意的程度不同，这个“在意程度”就是权重。&lt;/div&gt;
 &lt;/div&gt;
 &lt;div id=&quot;flight-side-focus&quot; class=&quot;text-small&quot; aria-live=&quot;polite&quot;&gt;你将经过朋友②，三人的计算列在下面。&lt;/div&gt;
 &lt;details&gt;&lt;summary&gt;展开完整 MLP 计算记录&lt;/summary&gt;&lt;div class=&quot;mlp-tensors tabular-nums text-small&quot; aria-live=&quot;polite&quot;&gt;
 &lt;div id=&quot;mlp-tensor-x&quot;&gt;输入 x = [0.80, 0.40]ᵀ&lt;/div&gt;&lt;div id=&quot;mlp-tensor-z&quot;&gt;加权总分 z¹ = 等待汇总&lt;/div&gt;&lt;div id=&quot;mlp-tensor-a&quot;&gt;激活结果 a¹ = 等待过闸&lt;/div&gt;&lt;div id=&quot;mlp-tensor-out&quot;&gt;输出总分 z² = 等待群聊汇总&lt;/div&gt;&lt;div id=&quot;mlp-tensor-p&quot;&gt;概率 ŷ = 等待换算&lt;/div&gt;
 &lt;/div&gt;&lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;展开权重矩阵与偏置&lt;/summary&gt;
 &lt;div class=&quot;text-small&quot;&gt;W¹ 每行是一位朋友、每列分别对应“饥饿”和“价格贵”。&lt;/div&gt;
 &lt;table class=&quot;table table-sm tabular-nums&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;W¹ / b¹&lt;/th&gt;&lt;th&gt;饥饿&lt;/th&gt;&lt;th&gt;价格贵&lt;/th&gt;&lt;th&gt;偏置&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td&gt;①&lt;/td&gt;&lt;td&gt;0.50&lt;/td&gt;&lt;td&gt;−1.00&lt;/td&gt;&lt;td&gt;−0.10&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;②&lt;/td&gt;&lt;td&gt;0.30&lt;/td&gt;&lt;td&gt;−0.50&lt;/td&gt;&lt;td&gt;0.10&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;③&lt;/td&gt;&lt;td&gt;1.50&lt;/td&gt;&lt;td&gt;−0.25&lt;/td&gt;&lt;td&gt;0.10&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;
 &lt;div class=&quot;text-small tabular-nums&quot;&gt;W² = [0.80, 0.70, 1.00]；b² = −0.08&lt;/div&gt;&lt;div class=&quot;text-small&quot;&gt;9 个权重 ＋ 4 个偏置 = 13 个参数。负权重的连线画成虚线。&lt;/div&gt;
 &lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;激活函数到底改变了什么？&lt;/summary&gt;&lt;div class=&quot;text-small&quot;&gt;隐藏层使用 ReLU：a = max(0, z)。朋友①的 −0.10 变成 0；朋友②的 0.14 保持不变。这个非线性步骤，让网络不只是反复做加减乘法。&lt;/div&gt;&lt;div class=&quot;text-small&quot;&gt;输出使用 Sigmoid：σ(z) = 1 ÷ (1 + e 的 −z 次方)。σ(1.218) ≈ 0.7717，即约 77.2%。&lt;/div&gt;&lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;展开三位朋友的完整账本&lt;/summary&gt;
 &lt;div class=&quot;table-responsive&quot;&gt;&lt;table class=&quot;table table-sm tabular-nums&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;朋友&lt;/th&gt;&lt;th&gt;饥饿贡献 ＋ 价格贡献 ＋ 原本倾向&lt;/th&gt;&lt;th&gt;传出的支持分&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
 &lt;tr&gt;&lt;td&gt;① 省钱派&lt;/td&gt;&lt;td&gt;0.80 × 0.50 + 0.40 × (−1.00) − 0.10 = −0.10&lt;/td&gt;&lt;td&gt;0.00&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td id=&quot;flight-friend-two&quot;&gt;② 纠结派 · 你的路线&lt;/td&gt;&lt;td&gt;0.80 × 0.30 + 0.40 × (−0.50) + 0.10 = 0.14&lt;/td&gt;&lt;td&gt;0.14&lt;/td&gt;&lt;/tr&gt;
 &lt;tr&gt;&lt;td&gt;③ 怕饿派&lt;/td&gt;&lt;td&gt;0.80 × 1.50 + 0.40 × (−0.25) + 0.10 = 1.20&lt;/td&gt;&lt;td&gt;1.20&lt;/td&gt;&lt;/tr&gt;
 &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
 &lt;div class=&quot;text-small&quot;&gt;本轮只传正向支持：负分归零，正分保留。支持分可以超过 1，此时还不是概率。群聊再给三人的意见分配权重：0.00 × 0.80 + 0.14 × 0.70 + 1.20 × 1.00 − 0.08 = 1.218，最终转换为约 77.2% 的点外卖概率。朋友只是神经元的比喻，所有参数均为教学演示值。&lt;/div&gt;
 &lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;前向传播和训练有什么区别？&lt;/summary&gt;&lt;div class=&quot;text-small&quot;&gt;这次飞行叫前向传播：权重与偏置固定，数据从输入一路算到输出。训练时，还需要真实结果；先用损失函数衡量误差，再通过反向传播和梯度下降调整这 13 个参数。本游戏当前演示前向传播，不会在飞行中自动训练。&lt;/div&gt;&lt;/details&gt;
